name: CESIZen CI/CD Pipeline

on:
  push:
    branches: [main, develop, dev]
  pull_request:
    branches: [main, develop, dev]

env:
  NODE_VERSION: '20'
  REGISTRY: ghcr.io
  IMAGE_API: ghcr.io/${{ github.repository }}/api
  IMAGE_WEB: ghcr.io/${{ github.repository }}/web

jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — Tests API (backend)
  # ─────────────────────────────────────────────
  test-api:
    name: Tests API
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_USER: cesizen
          POSTGRES_PASSWORD: cesizen_secret
          POSTGRES_DB: cesizen_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/api/package-lock.json

      - name: Installation des dépendances API
        working-directory: apps/api
        run: npm ci

      - name: Génération du client Prisma
        working-directory: apps/api
        run: npx prisma generate

      - name: Application des migrations (DB de test)
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://cesizen:cesizen_secret@localhost:5432/cesizen_test
        run: npx prisma migrate deploy

      - name: Lancement des tests
        working-directory: apps/api
        env:
          DATABASE_URL: postgresql://cesizen:cesizen_secret@localhost:5432/cesizen_test
          JWT_SECRET: ci_test_secret
          NODE_ENV: test
        run: npm test

  # ─────────────────────────────────────────────
  # JOB 2 — Build Frontend
  # ─────────────────────────────────────────────
  build-web:
    name: Build Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Installation des dépendances Web
        working-directory: apps/web
        run: npm ci

      - name: Build de production
        working-directory: apps/web
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL || 'http://localhost:3000' }}
        run: npm run build

      - name: Upload artifact du build
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: apps/web/dist/
          retention-days: 7

  # ─────────────────────────────────────────────
  # JOB 3 — Build et push des images Docker
  # (uniquement sur push vers main)
  # ─────────────────────────────────────────────
  build-docker:
    name: Build images Docker
    runs-on: ubuntu-latest
    needs: [test-api, build-web]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Connexion au registre GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extraction des métadonnées (tags) — API
        id: meta-api
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_API }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Extraction des métadonnées (tags) — Web
        id: meta-web
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_WEB }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' }}

      - name: Build et push image API
        uses: docker/build-push-action@v5
        with:
          context: apps/api
          push: true
          tags: ${{ steps.meta-api.outputs.tags }}
          labels: ${{ steps.meta-api.outputs.labels }}

      - name: Build et push image Web
        uses: docker/build-push-action@v5
        with:
          context: apps/web
          push: true
          tags: ${{ steps.meta-web.outputs.tags }}
          labels: ${{ steps.meta-web.outputs.labels }}

  # ─────────────────────────────────────────────
  # JOB 4 — Déploiement en production
  # (uniquement sur push vers main après build Docker)
  # ─────────────────────────────────────────────
  deploy:
    name: Déploiement production
    runs-on: ubuntu-latest
    needs: [build-docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: production
      url: https://cesizen.fr

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Déploiement via SSH sur le serveur de production
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.PROD_HOST }}
          username: ${{ secrets.PROD_USER }}
          key: ${{ secrets.PROD_SSH_KEY }}
          script: |
            cd ~/cesizen
            # Récupération de la dernière version de la configuration
            git pull origin main
            # Mise à jour des images Docker
            docker compose pull
            # Redémarrage des services avec zero-downtime
            docker compose up -d --no-deps --build api web
            # Nettoyage des anciennes images
            docker image prune -f
            echo "Déploiement terminé : $(date)"
