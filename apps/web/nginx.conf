# Redirection HTTP → HTTPS
server {
    listen 80;
    server_name 51.91.120.89.nip.io;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name 51.91.120.89.nip.io;

    ssl_certificate /etc/letsencrypt/live/51.91.120.89.nip.io/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/51.91.120.89.nip.io/privkey.pem;

    root /usr/share/nginx/html;
    index index.html;

    # SPA fallback - toutes les routes vers index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API vers le backend
    location /api/ {
        proxy_pass http://api:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
    }

    # Cache assets
    location ~* \.(js|css|png|jpg|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
